name: Claude PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    uses: deriv-com/shared-actions/.github/workflows/ai-pr-review.yml@master
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    with:
      engine: anthropic   # must be explicit; the default is kimi
    secrets:
      LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_METRICS_API_URL: ${{ secrets.AGENT_METRICS_API_URL }}
      AGENT_METRICS_API_KEY: ${{ secrets.AGENT_METRICS_API_KEY }}
